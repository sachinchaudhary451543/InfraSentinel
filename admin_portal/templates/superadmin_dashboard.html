<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Superadmin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4">
        <h1>Superadmin Dashboard</h1>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary float-end">Logout</a>
        <h2>Clients</h2>
        <div class="mb-3">
            <a href="{{ url_for('tenants.add_tenant') }}" class="btn btn-primary">Add Tenant</a>
            <a href="{{ url_for('users.add_user') }}" class="btn btn-success ms-2">Add User</a>
            <a href="{{ url_for('users.manage_users') }}" class="btn btn-info ms-2">Manage Users</a>
            <a href="{{ url_for('agents.agent_keys') }}" class="btn btn-outline-primary ms-2">Agent Keys</a>
            <a href="{{ url_for('systems.registered_agents') }}" class="btn btn-outline-success ms-2">Registered
                Agents</a>
            <a href="{{ url_for('discovery.discover_domain') }}" class="btn btn-outline-info ms-2">Discover Domain</a>
        </div>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for tenant in tenants %}
                <tr>
                    <td>{{ tenant.id }}</td>
                    <td>{{ tenant.name }}</td>
                    <td>
                        <a href="{{ url_for('tenants.manage_azure', tenant_id=tenant.id) }}"
                            class="btn btn-sm btn-outline-primary">Manage Azure</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
