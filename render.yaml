databases:
  - name: servermonitor-db
    databaseName: servermonitor
    user: monitor_user
    plan: free

services:
  # Redis KeyValue Store for Caching & Message Broker
  - type: keyvalue
    name: servermonitor-redis
    plan: free
    ipAllowList: []

  # Main Web Application (Performance Monitoring & Core APIs)
  - type: web
    name: servermonitor-web
    plan: free
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: web/app.py
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: servermonitor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: servermonitor-redis
          property: connectionString
      - key: REQUIRE_HTTPS
        value: "false"
      - key: VERIFY_SSL
        value: "true"

  # Admin Portal (Multi-Tenant Management)
  - type: web
    name: servermonitor-admin
    plan: free
    runtime: docker
    dockerfilePath: Dockerfile.admin
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: admin_portal/app.py
      - key: FLASK_DEBUG
        value: "0"
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: servermonitor-db
          property: connectionString
