{% extends "base.html" %}

{% block title %}Add Tenant - ServerMonitor{% endblock %}

{% block content %}
<div class="mb-8">
    <div class="flex items-center gap-3 mb-2">
        <a href="{{ url_for('tenants.list_tenants') }}" class="text-slate-400 hover:text-indigo-600 transition-colors tooltip" title="Back to Tenants">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="text-3xl font-bold text-slate-900 flex items-center gap-2" style="font-family:'Outfit',sans-serif">
            Add Tenant
        </h2>
    </div>
    <p class="text-slate-500 text-sm ml-7">Create a new tenant organization</p>
</div>

<div class="max-w-lg">
    <form method="POST" class="space-y-6">
        <div class="bg-white rounded-3xl border border-slate-100 shadow-[0_4px_24px_rgba(0,0,0,0.02)] p-6 md:p-8 relative overflow-hidden group">
            <div class="h-1.5 bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 absolute top-0 left-0 right-0"></div>

            <div class="space-y-5 relative z-10">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Tenant Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-building text-slate-400"></i>
                        </div>
                        <input type="text" name="name" required
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-10 pr-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all font-medium"
                            placeholder="e.g. BaffleSol Technologies">
                    </div>
                </div>
            </div>
        </div>

        <button type="submit"
            class="w-full flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-indigo-600 to-violet-600 shadow-lg shadow-indigo-500/25 transition-all hover:shadow-xl hover:-translate-y-0.5 hover:scale-[1.01]">
            <i class="fa-solid fa-plus"></i> Create Tenant
        </button>
    </form>
</div>
{% endblock %}
