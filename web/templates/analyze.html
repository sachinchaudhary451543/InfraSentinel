{% extends "base.html" %}

{% block title %}Server Metrics Analysis{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">Server Metrics Analysis</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Current Data Analysis -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Analyze Current Data</h2>
            <button id="analyzeCurrentBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Analyze Database
            </button>
            <div id="currentResults" class="mt-4"></div>
        </div>

        <!-- File Upload Analysis -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Upload & Analyze File</h2>
            <form id="uploadForm">
                <input type="file" accept=".csv,.xlsx" class="mb-4" name="file">
                <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Upload & Analyze
                </button>
            </form>
            <div id="uploadResults" class="mt-4"></div>
        </div>
    </div>

    <!-- Download Report Button -->
    <div class="mt-6">
        <a href="{{ url_for('smart_analyzer.download_analysis_report') }}"
            class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
            📥 Download Full Analysis Report
        </a>
    </div>
</div>

<script>
    document.getElementById('analyzeCurrentBtn').onclick = async () => {
        try {
            // FIXED: Use correct endpoint from smart_analyzer blueprint
            const response = await fetch('/smart-analyzer/analyze-current-metrics');
            const data = await response.json();
            displayResults(data, 'currentResults');
        } catch (error) {
            console.error('Analysis failed:', error);
            document.getElementById('currentResults').innerHTML =
                '<div class="text-red-500">Analysis failed. Please try again.</div>';
        }
    };

    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData();
        const fileInput = e.target.querySelector('input[type="file"]');
        formData.append('file', fileInput.files[0]);

        try {
            // FIXED: Use correct blueprint endpoint
            const response = await fetch('/smart-analyzer/upload-analyze', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            displayResults(data, 'uploadResults');
        } catch (error) {
            console.error('Upload failed:', error);
            document.getElementById('uploadResults').innerHTML =
                '<div class="text-red-500">Upload failed. Please try again.</div>';
        }
    };

    function displayResults(data, elementId) {
        const element = document.getElementById(elementId);
        let html = '<div class="space-y-4">';

        if (data.stats) {
            html += `
            <div class="grid grid-cols-2 gap-4">
                <div class="p-3 bg-gray-50 rounded">
                    <div class="text-sm text-gray-600">Records</div>
                    <div class="text-xl font-semibold">${data.stats.total_records || 0}</div>
                </div>
                <div class="p-3 bg-gray-50 rounded">
                    <div class="text-sm text-gray-600">Columns</div>
                    <div class="text-sm">${data.stats.columns || 0}</div>
                </div>
            </div>
        `;
        }

        if (data.plots && Array.isArray(data.plots)) {
            html += '<div class="space-y-4">';
            data.plots.forEach(plot => {
                html += `<img src="${plot}" class="w-full rounded" alt="Plot">`;
            });
            html += '</div>';
        }

        html += '</div>';
        element.innerHTML = html;
    }
</script>

<script src="{{ url_for('static', filename='dist/js/menu-toggle.min.js') }}"></script>
{% endblock %}
