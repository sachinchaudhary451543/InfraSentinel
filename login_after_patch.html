<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ServerMonitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1a4e 50%, #0f1529 100%);
            background-attachment: fixed;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.6s ease-out;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-badge {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.15);
        }

        .text-gradient {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-sso {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            transition: all 0.3s ease;
        }

        .btn-sso:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .divider-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .badge {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md animate-slide-up">
        <!-- Logo & Branding -->
        <div class="text-center mb-12">
            <div class="logo-badge mx-auto mb-6 animate-float" style="width: fit-content;">
                <img src="/static/images/logo_icon.png" alt="ServerMonitor" class="h-16 w-auto">
            </div>
            <h1 class="text-3xl font-bold text-white mb-2" style="font-family: 'Outfit', sans-serif;">
                ServerMonitor
            </h1>
            <p class="text-slate-400 text-sm">Enterprise Infrastructure Monitoring</p>
        </div>

        <!-- Main Card -->
        <div class="glass-effect rounded-2xl p-8 mb-6">




            <!-- SSO Section (Primary) -->
            <div class="mb-8">
                <div class="badge mb-4">Recommended</div>
                <h2 class="text-white font-semibold mb-4" style="font-family: 'Outfit', sans-serif;">
                    Sign in with Microsoft
                </h2>
                <a href="/auth/entra/login"
                    class="btn-sso w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl text-sm font-semibold text-white transition-all">
                    <svg width="20" height="20" viewBox="0 0 21 21">
                        <rect x="1" y="1" width="9" height="9" fill="#ffffff" />
                        <rect x="11" y="1" width="9" height="9" fill="#ffffff" />
                        <rect x="1" y="11" width="9" height="9" fill="#ffffff" />
                        <rect x="11" y="11" width="9" height="9" fill="#ffffff" />
                    </svg>
                    <span>Continue with Microsoft Entra ID</span>
                </a>
                <p class="text-xs text-slate-500 mt-3 text-center">
                    Fast, secure single sign-on for your organization
                </p>
            </div>

            <!-- Divider -->
            <div class="flex items-center gap-3 my-8">
                <div class="divider-line flex-1"></div>
                <span class="text-xs text-slate-600 font-medium">OR</span>
                <div class="divider-line flex-1"></div>
            </div>

            <!-- Traditional Login Section -->
            <div>
                <h2 class="text-white font-semibold mb-4" style="font-family: 'Outfit', sans-serif;">
                    Sign in with Password
                </h2>
                <form action="/login" method="POST" class="space-y-4">
                    <div>
                        <label for="username"
                            class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">
                            Username
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-slate-600 text-sm"></i>
                            </div>
                            <input type="text" name="username" id="username"
                                class="input-field pl-10 w-full rounded-lg p-3 text-sm text-white placeholder-slate-600 focus:outline-none"
                                placeholder="Enter your username" required>
                        </div>
                    </div>

                    <div>
                        <label for="password"
                            class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">
                            Password
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-slate-600 text-sm"></i>
                            </div>
                            <input type="password" name="password" id="password"
                                class="input-field pl-10 w-full rounded-lg p-3 text-sm text-white placeholder-slate-600 focus:outline-none"
                                placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit"
                        class="btn-secondary w-full py-3 px-4 rounded-lg text-sm font-semibold text-white focus:outline-none transition-all mt-6">
                        Sign In
                    </button>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center">
            <p class="text-xs text-slate-600">
                <i class="fas fa-shield-alt mr-1.5"></i>Secured by Microsoft Entra ID
            </p>
            <p class="text-xs text-slate-700 mt-3">
                © 2026 ServerMonitor. All rights reserved.
            </p>
        </div>
    </div>
</body>

</html>
