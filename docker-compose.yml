version: '3.8'

# ============================================================================
# PHASE 16: FULL DOCKER DEPLOYMENT WITH ALL SERVICES
# ============================================================================

services:
  # =========================================================================
  # PostgreSQL Database (replaces SQLite for production)
  # =========================================================================
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor_password}
      POSTGRES_DB: ${POSTGRES_DB:-servermonitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - servermonitor-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Redis for Caching & Background Jobs Queue
  # =========================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - servermonitor-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Main Flask Web Application
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-monitor_user}:${POSTGRES_PASSWORD:-monitor_password}@db:5432/${POSTGRES_DB:-servermonitor}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      
      # Flask
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_APP: web/app.py
      FLASK_DEBUG: 0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      
      # Security
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      VERIFY_SSL: ${VERIFY_SSL:-true}
      
      # Agent settings
      SERVER_URL: http://localhost:8080
      MAX_RETRIES: ${MAX_RETRIES:-3}
      METRICS_INTERVAL: ${METRICS_INTERVAL:-30}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      
      # Performance
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./uploads:/app/uploads
    
    ports:
      - "8080:8080"
    
    restart: always
    networks:
      - servermonitor-net
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # RQ Worker for Background Jobs (PHASE 12)
  # =========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    
    command: python -m rq worker jobs alerts metrics -w 4 --job-monitoring-interval 30
    
    environment:
      # Same as web service
      DATABASE_URL: postgresql://${POSTGRES_USER:-monitor_user}:${POSTGRES_PASSWORD:-monitor_password}@db:5432/${POSTGRES_DB:-servermonitor}
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: ${FLASK_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      PYTHONUNBUFFERED: 1
    
    depends_on:
      - db
      - redis
      - web
    
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    
    restart: always
    networks:
      - servermonitor-net
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # RQ Scheduler for Periodic Tasks
  # =========================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    
    command: python -m rq_scheduler --interval 60 --password ${SCHEDULER_PASSWORD:-}
    
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-monitor_user}:${POSTGRES_PASSWORD:-monitor_password}@db:5432/${POSTGRES_DB:-servermonitor}
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: ${FLASK_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: 1
    
    depends_on:
      - redis
      - db
    
    restart: always
    networks:
      - servermonitor-net
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Admin Portal (Flask)
  # =========================================================================
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_APP: admin_portal/app.py
      FLASK_DEBUG: 0
      SECRET_KEY: ${ADMIN_SECRET_KEY:-change-me-in-production}
      DATABASE_URL: sqlite:///./instance/admin_portal.db
    
    volumes:
      - ./admin_portal:/app/admin_portal
      - ./logs:/app/logs
      - ./instance:/app/instance
    
    ports:
      - "5001:5001"
    
    restart: always
    networks:
      - servermonitor-net
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Nginx Reverse Proxy & Load Balancer (PHASE 16)
  # =========================================================================
  nginx:
    image: nginx:alpine
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    
    ports:
      - "80:80"
      - "443:443"
    
    depends_on:
      - web
      - admin
    
    restart: always
    networks:
      - servermonitor-net
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  servermonitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
