# ============================================================================
# PHASE 16: NGINX PRODUCTION CONFIGURATION
# Features:
# - Reverse proxy to Flask apps
# - WebSocket support for Socket.IO
# - SSL/TLS ready (Let's Encrypt)
# - Gzip compression
# - Security headers
# - Rate limiting
# - Load balancing
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================================
    # LOGGING
    # ========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ========================================================================
    # PERFORMANCE & COMPRESSION
    # ========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/rss+xml application/json;
    gzip_disable "msie6";

    # ========================================================================
    # RATE LIMITING
    # ========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_status 429;

    # ========================================================================
    # UPSTREAM SERVERS
    # ========================================================================
    
    # Main web application
    upstream backend {
        least_conn;
        server web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Admin portal
    upstream admin_backend {
        server admin:5001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ========================================================================
    # REDIRECT HTTP TO HTTPS (if enabled in production)
    # ========================================================================
    # Uncomment in production with real SSL certificates:
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ========================================================================
    # HTTP SERVER (default)
    # ========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ====================================================================
        # SECURITY HEADERS
        # ====================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net; font-src 'self' fonts.googleapis.com; img-src 'self' data:; connect-src 'self'" always;

        # ====================================================================
        # HEALTH CHECK ENDPOINT
        # ====================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ====================================================================
        # MAIN APPLICATION ROUTES
        # ====================================================================
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Keep-alive
            proxy_set_header Connection "";
        }

        # ====================================================================
        # WEBSOCKET SUPPORT FOR SOCKET.IO
        # ====================================================================
        location /socket.io {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Longer timeouts for WebSocket
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # No buffering
            proxy_buffering off;
        }

        # ====================================================================
        # API ENDPOINTS (stricter rate limit)
        # ====================================================================
        location /api/v2/agent/metrics {
            # Agent metrics can be more frequent
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====================================================================
        # LOGIN ENDPOINT (strict rate limit)
        # ====================================================================
        location /login {
            limit_req zone=login_limit burst=5 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ====================================================================
        # STATIC FILES (cached)
        # ====================================================================
        location /static {
            alias /app/web/static;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /uploads {
            alias /app/uploads;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ====================================================================
        # ADMIN PORTAL
        # ====================================================================
        location /admin {
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====================================================================
        # DENY ACCESS TO SENSITIVE FILES
        # ====================================================================
        location ~ /\.env {
            deny all;
            access_log off;
        }

        location ~ /\.git {
            deny all;
            access_log off;
        }

        location ~ /config {
            deny all;
            access_log off;
        }

        # ====================================================================
        # 404 ERROR PAGE
        # ====================================================================
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # ====================================================================
        # 50x ERROR PAGES
        # ====================================================================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }

    # ========================================================================
    # HTTPS SERVER (for production with SSL)
    # ========================================================================
    # Uncomment and configure with real certificates:
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name monitoring.yourdomain.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # SSL Security Headers
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # Same configuration as HTTP server above
    #     # ... (copy location blocks here)
    # }
}
